<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng Ký - Zennie Home</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../css/login.css" />
  </head>
  <body>
    <div class="auth-container">
      <h1 class="auth-title">ĐĂNG KÝ</h1>
      <div class="auth-card">
        <form action="#">
          <div class="input-group">
            <label>Họ tên</label><input type="text" required />
          </div>
          <div class="input-group">
            <label>Email</label><input type="email" required />
          </div>
          <div class="input-group">
            <label>Mật khẩu</label><input type="password" required />
          </div>
          <button type="submit" class="btn-submit">Đăng ký ngay</button>
          <div class="auth-link">
            Đã có tài khoản? <a href="login.html">Đăng nhập</a>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
